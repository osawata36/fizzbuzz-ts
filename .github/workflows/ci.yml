name: CI sample

on:
  pull_request:
    branches:
      [ main ]

jobs:
  test:
    name: jest-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup node with cache option
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Test
        run: |
          npm ci
          npm test


